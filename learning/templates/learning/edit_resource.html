<!DOCTYPE html>
<html>
<head>
    <title>Edit Resource</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="card p-4">

        <h2>Edit Resource</h2>

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="title"
                value="{{ resource.title }}"
                class="form-control mb-3">

            <input
                type="text"
                name="subject"
                value="{{ resource.subject }}"
                class="form-control mb-3">

            <textarea
                name="description"
                class="form-control mb-3">{{ resource.description }}</textarea>

            <button class="btn btn-primary">
                Update Resource
            </button>

        </form>

    </div>

</div>

</body>
</html>
